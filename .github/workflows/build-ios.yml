name: Build iOS App

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'رابط سيرفر LibreChat على Railway (مثال: https://your-app.up.railway.app)'
        required: true
        default: 'https://your-librechat-domain.example.com'

jobs:
  # يبني نسخة للمحاكي (Simulator) فقط - لا يحتاج أي توقيع Apple.
  # هدفه التأكد إن مشروع iOS بيتكمبايل بنجاح.
  build-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Set LibreChat server URL
        env:
          LIBRECHAT_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: node scripts/set-server-url.js

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Build for iOS Simulator (unsigned)
        working-directory: mobile-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybertools-hub-ios-simulator
          path: mobile-app/ios/App/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: ignore

  # =====================================================================
  # بناء موقّع لجهاز آيفون حقيقي - يعمل فقط لو أضفت الأسرار (Secrets) التالية
  # في إعدادات الريبو (Settings -> Secrets and variables -> Actions):
  #   IOS_BUILD_CERTIFICATE_BASE64   -> شهادة التوقيع (.p12) بصيغة base64
  #   IOS_CERTIFICATE_PASSWORD       -> كلمة مرور ملف .p12
  #   IOS_PROVISIONING_PROFILE_BASE64 -> ملف provisioning profile بصيغة base64
  #   IOS_KEYCHAIN_PASSWORD          -> أي كلمة مرور مؤقتة تختارها لل keychain
  #   IOS_TEAM_ID                    -> Apple Developer Team ID
  # هذه الأسرار مطلوبة فقط لو اخترت خيار "حساب Apple Developer المدفوع".
  # لو هتستخدم الطريقة المجانية (AltStore/Sideloadly)، حمّل الـ build-simulator
  # أو اطلب مني تفعيل خطوة تصدير IPA غير موقّع بدلاً من هذا الجوب.
  # =====================================================================
  build-device-signed:
    needs: build-simulator
    if: ${{ vars.IOS_SIGNING_ENABLED == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Set LibreChat server URL
        env:
          LIBRECHAT_SERVER_URL: ${{ github.event.inputs.server_url }}
        run: node scripts/set-server-url.js

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Import signing certificate & provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Archive & export signed IPA
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        working-directory: mobile-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" archive

          cat > $RUNNER_TEMP/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybertools-hub-ios-signed
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
