version: 1.3.13

cache: true

interface:
  customWelcome: 'Welcome to CyberTools AI.'
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  fileCitations: true
  defaultPinnedTools:
    - 'web_search'
    - 'file_search'
  prompts:
    use: true
    create: true
    share: false
    public: false
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  privacyPolicy:
    externalUrl: 'https://www.librechat.ai/privacy-policy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://www.librechat.ai/tos'
    openNewTab: true
    modalAcceptance: false

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    titleTiming: immediate
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities: ['deferred_tools', 'execute_code', 'file_search', 'actions', 'tools']
  custom:
    - name: 'AgentRouter'
      apiKey: '${AGENTROUTER_API_KEY}'
      baseURL: 'https://agentrouter.org/v1'
      models:
        default:
          - 'gpt-5'
          - 'gpt-5.5'
        fetch: false
      titleConvo: false
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      modelDisplayLabel: 'AgentRouter'

    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
          - 'openrouter/free'
          - 'openrouter/auto'
        fetch: true
      titleConvo: false
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      modelDisplayLabel: 'OpenRouter'

modelSpecs:
  list:
    - name: 'cybertools-main'
      label: 'CyberTools AI'
      description: 'Primary assistant using OpenRouter free routing with automatic selection among available free models.'
      default: true
      preset:
        endpoint: 'OpenRouter'
        model: 'openrouter/free'
        instructions: |
          You are CyberTools AI, a professional general-purpose assistant with strong software engineering, system architecture, business analysis, document research, and defensive cybersecurity skills.
          Give accurate, practical, production-ready answers. Prefer verified facts, cite sources when tools provide them, protect secrets and personal data, and clearly state uncertainty.
          For programming and infrastructure tasks, inspect context before changing anything, preserve working behavior, apply least privilege, validate inputs, and include safe rollback guidance.
          Only assist with authorized and defensive security work. Refuse malware, credential theft, phishing, persistence, stealth, evasion, and unauthorized exploitation.

    - name: 'cybertools-smart-router'
      label: 'CyberTools Smart Router'
      description: 'OpenRouter automatic smart routing. This may use paid models if the OpenRouter account has credit.'
      preset:
        endpoint: 'OpenRouter'
        model: 'openrouter/auto'
        instructions: |
          You are CyberTools AI. Select and use the best available reasoning approach for the task. Produce accurate, practical, well-structured answers and protect sensitive information.

    - name: 'agentrouter-gpt5'
      label: 'AgentRouter GPT-5'
      description: 'Use when the AgentRouter account has available credit and supports the configured model.'
      preset:
        endpoint: 'AgentRouter'
        model: 'gpt-5'

    - name: 'cybertools-openai'
      label: 'CyberTools OpenAI'
      description: 'Direct OpenAI model. Requires active OpenAI API billing and quota.'
      preset:
        endpoint: 'openAI'
        model: 'gpt-4o-mini'
        instructions: |
          You are CyberTools AI, a professional assistant for software engineering, research, document analysis, and defensive cybersecurity.

memory:
  disabled: false
  validKeys: ['preferences', 'work_info', 'personal_info', 'skills', 'interests', 'context']
  tokenLimit: 6000
  maxInputTokens: 12000
  personalize: true

messageFilter:
  pii:
    starterPatterns: ['sk_prefix', 'bearer_header', 'api_key_header']