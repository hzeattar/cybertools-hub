version: 1.3.13

cache: true

interface:
  customWelcome: 'Welcome to CyberTools AI.'
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  fileCitations: true
  defaultPinnedTools:
    - 'web_search'
    - 'file_search'
  prompts:
    use: true
    create: true
    share: false
    public: false
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  privacyPolicy:
    externalUrl: 'https://www.librechat.ai/privacy-policy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://www.librechat.ai/tos'
    openNewTab: true
    modalAcceptance: false

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    titleTiming: immediate
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities: ['deferred_tools', 'execute_code', 'file_search', 'actions', 'tools']
  custom:
    - name: 'AgentRouter'
      apiKey: '${AGENTROUTER_API_KEY}'
      baseURL: 'https://agentrouter.org/v1'
      models:
        default:
          - 'gpt-5.5'
          - 'close-work-4-8'
          - 'close-work-4-7'
          - 'close-work-4-6'
          - 'glm-5.2'
        fetch: false
      titleConvo: false
      summarize: false
      dropParams: ['stop', 'user', 'temperature', 'top_p', 'frequency_penalty', 'presence_penalty']
      modelDisplayLabel: 'AgentRouter'

    - name: 'OpenRouter Free'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          - 'openrouter/free'
        fetch: false
      titleConvo: false
      summarize: false
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      modelDisplayLabel: 'OpenRouter Free'

modelSpecs:
  list:
    - name: 'cybertools-main'
      label: 'CyberTools AI — AgentRouter GPT-5.5'
      description: 'Primary production assistant using the AgentRouter account connected to agentrouter.org.'
      default: true
      preset:
        endpoint: 'AgentRouter'
        model: 'gpt-5.5'
        instructions: |
          You are CyberTools AI, a professional general-purpose assistant with strong software engineering, system architecture, business analysis, document research, and defensive security skills.
          Give accurate, practical, production-ready answers. Prefer verified facts, cite sources when available, protect private information, and clearly state uncertainty.
          Inspect the available context before making changes, preserve working behavior, validate inputs, and include rollback guidance for infrastructure work.

    - name: 'cybertools-close-work-48'
      label: 'CyberTools Close Work 4.8'
      description: 'AgentRouter model available on the connected account.'
      preset:
        endpoint: 'AgentRouter'
        model: 'close-work-4-8'

    - name: 'cybertools-close-work-47'
      label: 'CyberTools Close Work 4.7'
      description: 'AgentRouter model available on the connected account.'
      preset:
        endpoint: 'AgentRouter'
        model: 'close-work-4-7'

    - name: 'cybertools-close-work-46'
      label: 'CyberTools Close Work 4.6'
      description: 'AgentRouter model available on the connected account.'
      preset:
        endpoint: 'AgentRouter'
        model: 'close-work-4-6'

    - name: 'cybertools-glm-52'
      label: 'CyberTools GLM 5.2'
      description: 'GLM 5.2 through the connected AgentRouter account.'
      preset:
        endpoint: 'AgentRouter'
        model: 'glm-5.2'

    - name: 'cybertools-openrouter-free'
      label: 'CyberTools Free Backup'
      description: 'OpenRouter free-model router only; paid OpenRouter models are hidden.'
      preset:
        endpoint: 'OpenRouter Free'
        model: 'openrouter/free'
        instructions: |
          You are CyberTools AI. Give practical, accurate answers and clearly state uncertainty.

memory:
  disabled: false
  validKeys: ['preferences', 'work_info', 'personal_info', 'skills', 'interests', 'context']
  tokenLimit: 6000
  maxInputTokens: 12000
  personalize: true

messageFilter:
  pii:
    starterPatterns: ['sk_prefix', 'bearer_header', 'api_key_header']
