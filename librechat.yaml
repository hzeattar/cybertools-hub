version: 1.3.13

cache: true

interface:
  customWelcome: 'Welcome to CyberTools AI.'
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  fileCitations: true
  defaultPinnedTools:
    - 'web_search'
    - 'file_search'
  prompts:
    use: true
    create: true
    share: false
    public: false
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  privacyPolicy:
    externalUrl: 'https://www.librechat.ai/privacy-policy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://www.librechat.ai/tos'
    openNewTab: true
    modalAcceptance: false

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    titleTiming: immediate
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities: ['deferred_tools', 'execute_code', 'file_search', 'actions', 'tools']
  custom:
    - name: 'AgentRouter'
      apiKey: '${AGENTROUTER_API_KEY}'
      baseURL: 'https://co.agentrouter.org/v1'
      models:
        default:
          - 'gpt-5.5'
          - 'kimi-k2.6'
          - 'glm-5.1'
        fetch: true
      titleConvo: false
      summarize: false
      dropParams: ['stop', 'user', 'temperature', 'top_p', 'frequency_penalty', 'presence_penalty']
      modelDisplayLabel: 'AgentRouter'

    - name: 'AgentRouter Claude'
      provider: 'anthropic'
      apiKey: '${AGENTROUTER_API_KEY}'
      baseURL: 'https://co.agentrouter.org'
      headers:
        anthropic-version: '2023-06-01'
      models:
        default:
          - 'claude-opus-4-8'
          - 'claude-opus-4-7'
          - 'claude-opus-4-6'
          - 'claude-sonnet-4-6'
        fetch: false
      titleConvo: false
      summarize: false
      modelDisplayLabel: 'AgentRouter Claude'

    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
          - 'openrouter/free'
          - 'openrouter/auto'
        fetch: true
      titleConvo: false
      summarize: false
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      modelDisplayLabel: 'OpenRouter'

modelSpecs:
  list:
    - name: 'cybertools-main'
      label: 'CyberTools AI — AgentRouter GPT-5.5'
      description: 'Primary production assistant using the funded AgentRouter OpenAI-compatible endpoint.'
      default: true
      preset:
        endpoint: 'AgentRouter'
        model: 'gpt-5.5'
        instructions: |
          You are CyberTools AI, a professional general-purpose assistant with strong software engineering, system architecture, business analysis, document research, and defensive cybersecurity skills.
          Give accurate, practical, production-ready answers. Prefer verified facts, cite sources when tools provide them, protect secrets and personal data, and clearly state uncertainty.
          For programming and infrastructure tasks, inspect context before changing anything, preserve working behavior, apply least privilege, validate inputs, and include safe rollback guidance.
          Only assist with authorized and defensive security work. Refuse malware, credential theft, phishing, persistence, stealth, evasion, and unauthorized exploitation.

    - name: 'cybertools-claude-opus'
      label: 'CyberTools Claude Opus 4.8'
      description: 'Claude through AgentRouter using the required Anthropic-compatible protocol.'
      preset:
        endpoint: 'AgentRouter Claude'
        model: 'claude-opus-4-8'
        instructions: |
          You are CyberTools AI, a careful senior software engineer and research assistant. Produce accurate, structured, production-ready work and protect sensitive data.

    - name: 'cybertools-agentrouter-kimi'
      label: 'CyberTools Kimi K2.6'
      description: 'Kimi K2.6 through the AgentRouter OpenAI-compatible endpoint.'
      preset:
        endpoint: 'AgentRouter'
        model: 'kimi-k2.6'

    - name: 'cybertools-agentrouter-glm'
      label: 'CyberTools GLM 5.1'
      description: 'GLM 5.1 through the AgentRouter OpenAI-compatible endpoint.'
      preset:
        endpoint: 'AgentRouter'
        model: 'glm-5.1'

    - name: 'cybertools-openrouter-free'
      label: 'CyberTools Free Backup'
      description: 'OpenRouter free routing fallback when paid providers are unavailable.'
      preset:
        endpoint: 'OpenRouter'
        model: 'openrouter/free'
        instructions: |
          You are CyberTools AI. Give practical, accurate answers and clearly state uncertainty.

    - name: 'cybertools-openai'
      label: 'CyberTools Direct OpenAI'
      description: 'Direct OpenAI endpoint. Requires active OpenAI API billing and quota.'
      preset:
        endpoint: 'openAI'
        model: 'gpt-4o-mini'
        instructions: |
          You are CyberTools AI, a professional assistant for software engineering, research, document analysis, and defensive cybersecurity.

memory:
  disabled: false
  validKeys: ['preferences', 'work_info', 'personal_info', 'skills', 'interests', 'context']
  tokenLimit: 6000
  maxInputTokens: 12000
  personalize: true

messageFilter:
  pii:
    starterPatterns: ['sk_prefix', 'bearer_header', 'api_key_header']