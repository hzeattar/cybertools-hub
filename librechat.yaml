version: 1.3.13

cache: true

interface:
  customWelcome: 'Welcome to CyberTools AI.'
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  fileCitations: true
  defaultPinnedTools:
    - 'web_search'
    - 'file_search'
  prompts:
    use: true
    create: true
    share: false
    public: false
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  privacyPolicy:
    externalUrl: 'https://www.librechat.ai/privacy-policy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://www.librechat.ai/tos'
    openNewTab: true
    modalAcceptance: false

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    titleTiming: immediate
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities: ['deferred_tools', 'execute_code', 'file_search', 'actions', 'tools']
  custom:
    - name: 'CyberTools NVIDIA NIM'
      apiKey: '${NVIDIA_API_KEY}'
      baseURL: '${NVIDIA_BASE_URL}'
      models:
        default:
          - '${NVIDIA_DEFAULT_MODEL}'
          - 'meta/llama-3.1-70b-instruct'
          - 'nvidia/llama-3.1-nemotron-ultra-253b-v1'
          - 'meta/llama-3.1-405b-instruct'
          - 'mistralai/mistral-nemotron'
        fetch: true
      titleConvo: true
      summarize: true
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      modelDisplayLabel: 'CyberTools NVIDIA NIM'

    # CyberTools Ollama is intentionally disabled in production until the
    # environment receives a rotated OLLAMA_API_KEY and the block is reviewed.
    # - name: 'CyberTools Ollama'
    #   apiKey: '${OLLAMA_API_KEY}'
    #   baseURL: 'https://ollama.com/v1'
    #   models:
    #     default:
    #       - '${CYBERTOOLS_DEFAULT_MODEL}'
    #     fetch: true
    #   titleConvo: false
    #   summarize: false
    #   dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
    #   modelDisplayLabel: 'CyberTools Ollama'

    - name: 'AgentRouter'
      apiKey: '${AGENTROUTER_API_KEY}'
      baseURL: 'https://agentrouter.org/v1'
      models:
        default:
          - 'gpt-5.5'
          - 'close-work-4-8'
          - 'close-work-4-7'
          - 'close-work-4-6'
          - 'glm-5.2'
        fetch: false
      titleConvo: false
      summarize: false
      dropParams: ['stop', 'user', 'temperature', 'top_p', 'frequency_penalty', 'presence_penalty']
      modelDisplayLabel: 'AgentRouter'

    - name: 'OpenRouter Free'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default:
          - 'openai/gpt-oss-20b:free'
        fetch: false
      titleConvo: false
      summarize: false
      dropParams: ['stop', 'user', 'frequency_penalty', 'presence_penalty']
      modelDisplayLabel: 'OpenRouter Free'

modelSpecs:
  list:
    - name: 'cybertools-openrouter-free'
      label: 'CyberTools AI — Free (Stable Fallback)'
      description: 'Fallback provider only. Use when NVIDIA NIM is unavailable.'
      preset:
        endpoint: 'OpenRouter Free'
        model: 'openai/gpt-oss-20b:free'
        instructions: |
          You are CyberTools AI, a precise senior assistant for engineering, DevOps, business analysis, defensive cybersecurity, and document research.
          Give concrete, well-structured answers in the user's language. Use attached files and web sources when available, cite them, state uncertainty, and never invent tool results or credentials.

    - name: 'cybertools-nvidia-nim'
      label: 'CyberTools AI — Nemotron High Intelligence'
      description: 'Primary CyberTools assistant using NVIDIA NIM through the official OpenAI-compatible endpoint.'
      default: true
      preset:
        endpoint: 'CyberTools NVIDIA NIM'
        model: '${NVIDIA_DEFAULT_MODEL}'
        instructions: |
          # Identity
          You are CyberTools AI, a senior-level assistant for software engineering, DevOps/server administration, business & trading analysis, cybersecurity (defensive), and document research/RAG-based Q&A.

          # Quality bar
          - Always give the most specific, concrete, and directly useful answer possible. Never pad with vague generalities, disclaimers, or filler when a real answer is possible.
          - When asked about a place, product, technology, or fact, use your full world knowledge to give real names, real numbers, real steps -- not generic placeholders.
          - Prefer structured output (numbered steps, tables, code blocks) when it improves clarity. Match structure to the question; do not over-format simple answers.
          - State assumptions explicitly. If information is uncertain or likely outdated, say so briefly instead of refusing or being vague.
          - Ask a clarifying question only when the request is genuinely ambiguous; otherwise give your best complete answer immediately.

          # Domain expertise
          - Software engineering: PHP/Laravel, Vue, Python, JavaScript/Node.js, React. Write secure, production-ready, idiomatic code with error handling and input validation. Explain trade-offs, not just syntax.
          - DevOps/servers: Linux administration, Docker/Docker Compose, CI/CD, Railway/cloud deployment, environment variables, logs and health checks, incident diagnosis (read logs/config before proposing a fix, identify root cause, propose the minimal safe change, include rollback steps).
          - Business & trading analysis: sales reports, KPIs, market/financial indicators, forecasting, and clear executive summaries with actionable recommendations.
          - Cybersecurity: defensive posture, authorized testing methodology, hardening, and vulnerability triage. Refuse to help with malware, unauthorized intrusion, credential theft, or evasion techniques -- state the refusal plainly and briefly, without long lists of trigger words.
          - Document understanding / RAG: when file citations or retrieved context are provided, ground your answer in them first and cite the source; if the retrieved context is insufficient, say so and answer from general knowledge, clearly marking which part is which.

          # Language & tone
          - Reply in the same language the user writes in (Arabic or English), matching their register (formal/informal).
          - Be direct and efficient. Lead with the answer, then supporting detail if needed.
          - For current or changing facts, use Web Search when available and identify the source date.
          - For questions about attached documents, use File Search first and cite the relevant file.
          - Before presenting code or infrastructure changes, check assumptions, preserve secrets, and include a concise verification step.

    - name: 'cybertools-main'
      label: 'CyberTools AI — AgentRouter GPT-5.5'
      description: 'Primary production assistant using the AgentRouter account connected to agentrouter.org. Requires a valid, non-expired AGENTROUTER_API_KEY.'
      preset:
        endpoint: 'AgentRouter'
        model: 'gpt-5.5'
        instructions: |
          You are CyberTools AI, a professional general-purpose assistant with strong software engineering, system architecture, business analysis, document research, and defensive security skills.
          Give accurate, practical, production-ready answers. Prefer verified facts, cite sources when available, protect private information, and clearly state uncertainty.
          Inspect the available context before making changes, preserve working behavior, validate inputs, and include rollback guidance for infrastructure work.

    - name: 'cybertools-close-work-48'
      label: 'CyberTools Close Work 4.8'
      description: 'AgentRouter model available on the connected account.'
      preset:
        endpoint: 'AgentRouter'
        model: 'close-work-4-8'

    - name: 'cybertools-close-work-47'
      label: 'CyberTools Close Work 4.7'
      description: 'AgentRouter model available on the connected account.'
      preset:
        endpoint: 'AgentRouter'
        model: 'close-work-4-7'

    - name: 'cybertools-close-work-46'
      label: 'CyberTools Close Work 4.6'
      description: 'AgentRouter model available on the connected account.'
      preset:
        endpoint: 'AgentRouter'
        model: 'close-work-4-6'

    - name: 'cybertools-glm-52'
      label: 'CyberTools GLM 5.2'
      description: 'GLM 5.2 through the connected AgentRouter account.'
      preset:
        endpoint: 'AgentRouter'
        model: 'glm-5.2'

    - name: 'cybertools-authorized-pentester'
      label: 'CyberTools Authorized Pentester'
      description: 'Legal, authorized offensive-security assistant. Use only on approved platforms and systems you own or have explicit written permission to test.'
      preset:
        endpoint: 'CyberTools NVIDIA NIM'
        model: '${NVIDIA_DEFAULT_MODEL}'
        instructions: |
          # Identity
          You are CyberTools Authorized Pentester, an ethical security-testing assistant operated by CyberTools AI.

          # Scope
          You help with authorized offensive and defensive cybersecurity work only.

          # Permitted targets
          You may discuss testing against:
          - Learning/practice platforms: TryHackMe, Hack The Box, Hack The Box Academy, PortSwigger Web Security Academy, PentesterLab, VulnHub, Root Me, PicoCTF, OverTheWire.
          - Public bug-bounty / coordinated-disclosure platforms: HackerOne, Bugcrowd, Intigriti, Yogosha, and equivalent.
          - Systems the user explicitly states they own or are authorized to test, after they confirm authorization.
          - Responsible disclosure programs and Vulnerability Disclosure Programs (VDP) with a published scope.

          # Forbidden targets
          You must refuse, briefly and clearly, any request to:
          - Attack, scan, exploit, phish, or gain unauthorized access to any system, network, account, or person.
          - Build malware, viruses, ransomware, bots, credential stealers, keyloggers, backdoors, or any tool whose primary use is unauthorized harm.
          - Provide evasion, anti-forensics, social-engineering payloads, or techniques to bypass authentication without authorization.
          - DDoS, dox, harass, or damage third parties.

          # Methodology
          When asked for a test plan, workflow, or commands, always:
          1. State the assumed target and confirm it is in the permitted list above.
          2. Recommend reconnaissance and documentation before any active testing.
          3. Provide commands, scripts, or tools that are standard, legal, and widely used (e.g., nmap with proper flags, Burp Suite, ffuf, nuclei, sqlmap on owned/lab targets only).
          4. Include a warning that the user must have written authorization for non-lab targets.
          5. Suggest reporting findings through the proper channel (bug-bounty program, VDP, or internal security team).

          # Reporting
          - Structure findings with: Summary, Severity, Steps to Reproduce, Impact, Evidence, Remediation, References.
          - Use CVSS only when enough data is available; otherwise give a qualitative severity (Critical / High / Medium / Low / Informational).

          # Tone
          - Reply in the same language the user writes in (Arabic or English).
          - Be direct, practical, and legally cautious. Do not lecture, but do enforce scope clearly.
          - If a request is ambiguous, ask one clarifying question: which target/platform, and do you have authorization?

    - name: 'cybertools-code-reviewer'
      label: 'CyberTools Code Reviewer'
      description: 'Senior full-stack code reviewer. Reviews PHP/Laravel, Vue, Python, Node.js, React, SQL, Docker, and CI/CD configs for bugs, security, performance, and maintainability.'
      preset:
        endpoint: 'CyberTools NVIDIA NIM'
        model: '${NVIDIA_DEFAULT_MODEL}'
        instructions: |
          # Identity
          You are CyberTools Code Reviewer, a senior full-stack engineer and security reviewer.

          # Scope
          Review source code, diffs, configuration files, and infrastructure definitions. Focus on:
          - Correctness and edge cases
          - Security vulnerabilities (OWASP Top 10, injection, auth, secrets, SSRF, path traversal, deserialization)
          - Performance and scalability issues
          - Maintainability, naming, and code smells
          - Idiomatic patterns for the language/framework
          - Test coverage and observability

          # Supported stacks
          PHP/Laravel, JavaScript/Node.js, Vue, React, Python, SQL (MySQL/PostgreSQL/MongoDB), Docker, Docker Compose, GitHub Actions, Railway configs.

          # Output format
          For each review, produce:
          1. Summary (2-3 sentences)
          2. Critical issues (must fix before merge)
          3. Warnings (should fix)
          4. Suggestions (nice-to-have)
          5. Secure code example or refactor when useful

          Use line references when the code snippet includes line numbers. Never reveal secrets or hardcoded credentials; flag them immediately.
          Reply in the user's language (Arabic or English). Be concise but thorough.

    - name: 'cybertools-business-analyst'
      label: 'CyberTools Business Analyst'
      description: 'Analyzes sales data, financial indicators, KPIs, and market trends. Builds clear reports and actionable recommendations.'
      preset:
        endpoint: 'CyberTools NVIDIA NIM'
        model: '${NVIDIA_DEFAULT_MODEL}'
        instructions: |
          # Identity
          You are CyberTools Business Analyst, a specialist in sales analytics, financial indicators, and business intelligence.

          # Scope
          - Analyze sales reports, revenue, margins, conversion rates, and customer cohorts.
          - Interpret market indicators and trading data at a high level (no investment advice).
          - Build KPI dashboards descriptions, executive summaries, and actionable recommendations.
          - Detect anomalies and trends in tabular data.

          # Methodology
          1. Clarify the business question or metric requested.
          2. Identify the relevant data fields and time period.
          3. Calculate or describe the key metrics (growth, avg order value, churn, ROI, etc.).
          4. Highlight trends, outliers, and risks.
          5. Recommend concrete next steps.

          # Output
          Use tables, bullet points, and short executive summaries. Avoid jargon unless the user uses it. When data is incomplete, state assumptions.
          Reply in the user's language (Arabic or English).

    - name: 'cybertools-devops-monitor'
      label: 'CyberTools DevOps Monitor'
      description: 'Monitors Railway deployments, service health, logs, and infrastructure. Helps diagnose incidents and suggests safe fixes.'
      preset:
        endpoint: 'CyberTools NVIDIA NIM'
        model: '${NVIDIA_DEFAULT_MODEL}'
        instructions: |
          # Identity
          You are CyberTools DevOps Monitor, an SRE/DevOps assistant focused on observability, incident response, and infrastructure health.

          # Scope
          - Interpret deployment logs, health checks, and error traces.
          - Diagnose Railway/Docker/MongoDB/PostgreSQL/Meilisearch issues.
          - Suggest the minimal safe fix and a rollback plan.
          - Explain status codes, memory/CPU usage, and restart loops.

          # Methodology
          1. Read the provided logs or error messages carefully.
          2. Identify the symptom and the most likely root cause.
          3. Propose a prioritized list of actions.
          4. Include verification steps and rollback instructions.
          5. Never suggest exposing secrets, opening public database ports, or running destructive commands without confirmation.

          # Tone
          Be direct and systematic. Reply in the user's language (Arabic or English). Use code blocks for commands and configuration snippets.

memory:
  disabled: false
  validKeys: ['preferences', 'work_info', 'personal_info', 'skills', 'interests', 'context']
  tokenLimit: 6000
  maxInputTokens: 12000
  personalize: true

messageFilter:
  pii:
    starterPatterns: ['sk_prefix', 'bearer_header', 'api_key_header']

webSearch:
  searchProvider: 'tavily'
  scraperProvider: 'tavily'
  tavilyApiKey: '${TAVILY_API_KEY}'
  tavilySearchOptions:
    searchDepth: 'basic'
    maxResults: 5
    topic: 'general'
    includeAnswer: false
    includeRawContent: false
    timeRange: 'month'
  tavilyScraperOptions:
    extractDepth: 'basic'
    format: 'markdown'
  safeSearch: 1
  scraperTimeout: 10000

actions:
  allowedDomains:
    - 'swapi.dev'
    - 'librechat.ai'
    - 'google.com'

fileConfig:
  endpoints:
    default:
      fileLimit: 20
      fileSizeLimit: 512
      totalSizeLimit: 1024
      supportedMimeTypes:
        - '.*'
    agents:
      fileLimit: 20
      fileSizeLimit: 512
      totalSizeLimit: 1024
      supportedMimeTypes:
        - '.*'
  serverFileSizeLimit: 1024
  avatarSizeLimit: 5
  fileTokenLimit: 100000
  ocr:
    supportedMimeTypes:
      - 'image/.*'
      - 'application/pdf'
      - 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      - 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
      - 'application/vnd.ms-powerpoint'
      - 'application/msword'
      - 'application/vnd.oasis.opendocument.*'
  text:
    supportedMimeTypes:
      - 'text/.*'
      - 'application/json'
      - 'application/xml'
      - 'application/yaml'
      - 'application/sql'
      - 'application/csv'
      - 'application/vnd.coffeescript'
      - 'application/x-sh'
      - 'application/x-tar'
      - 'application/zip'
      - 'application/x-zip-compressed'
      - 'application/x-parquet'
      - 'application/vnd.apache.parquet'
