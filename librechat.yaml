version: 1.3.13

cache: true

interface:
  customWelcome: 'Welcome to CyberTools AI.'
  fileSearch: true
  modelSelect: true
  parameters: true
  presets: true
  bookmarks: true
  multiConvo: true
  fileCitations: true
  prompts:
    use: true
    create: true
    share: false
    public: false
  agents:
    use: true
    create: true
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  privacyPolicy:
    externalUrl: 'https://www.librechat.ai/privacy-policy'
    openNewTab: true
  termsOfService:
    externalUrl: 'https://www.librechat.ai/tos'
    openNewTab: true
    modalAcceptance: false

endpoints:
  agents:
    recursionLimit: 50
    maxRecursionLimit: 100
    disableBuilder: false
    titleTiming: immediate
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities: ['deferred_tools', 'execute_code', 'file_search', 'actions', 'tools']
  custom:
    - name: 'AgentRouter'
      apiKey: '${AGENTROUTER_API_KEY}'
      baseURL: 'https://agentrouter.org/v1'
      models:
        default:
          - 'gpt-5.5'
          - 'close-work-4-8'
          - 'close-work-4-7'
          - 'close-work-4-6'
          - 'glm-5.2'
        fetch: false
      titleConvo: true
      titleModel: 'gpt-5.5'
      dropParams: ['stop', 'user', 'temperature', 'top_p', 'frequency_penalty', 'presence_penalty']
      modelDisplayLabel: 'AgentRouter'

    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      headers:
        x-librechat-body-parentmessageid: '{{LIBRECHAT_BODY_PARENTMESSAGEID}}'
      models:
        default:
          - 'openai/gpt-oss-20b:free'
        fetch: false
      titleConvo: true
      titleModel: 'openai/gpt-oss-20b:free'
      dropParams: ['stop']
      modelDisplayLabel: 'OpenRouter'

modelSpecs:
  list:
    - name: 'cybertools-free-chat'
      label: 'CyberTools Free Chat'
      description: 'Stable free fallback for general chat, coding help, and defensive security analysis.'
      default: true
      preset:
        endpoint: 'OpenRouter'
        model: 'openai/gpt-oss-20b:free'
        temperature: 0.7
        instructions: |
          You are CyberTools AI, a professional assistant for software engineering, research, business analysis, and document understanding. Provide accurate and practical answers.

    - name: 'agentrouter-gpt5-5'
      label: 'AgentRouter GPT-5.5'
      description: 'Use when a valid, funded AgentRouter key is configured.'
      preset:
        endpoint: 'AgentRouter'
        model: 'gpt-5.5'
        temperature: 0.6
        instructions: |
          You are CyberTools AI, a professional assistant for software engineering, research, business analysis, and document understanding. Provide accurate and practical answers.

memory:
  disabled: false
  validKeys: ['preferences', 'work_info', 'personal_info', 'skills', 'interests', 'context']
  tokenLimit: 10000
  maxInputTokens: 12000
  personalize: true

messageFilter:
  pii:
    starterPatterns: ['sk_prefix', 'bearer_header', 'api_key_header']
